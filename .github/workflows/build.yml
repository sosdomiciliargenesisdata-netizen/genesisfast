name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar os componentes do Android
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar o Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Recibos-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
